
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       88;
        server_name  192.168.16.170;

        location / {
            root   html;
            index  index.html;
        }

        location /api {
            proxy_pass http://192.168.16.170:8000;
        }
    }

}
